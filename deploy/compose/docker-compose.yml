name: proxyconsole-dev001

services:
  edge:
    build:
      context: ../..
      dockerfile: deploy/nginx/edge/Dockerfile
    ports:
      - "${EDGE_HTTPS_PORT:-8443}:443"
    depends_on:
      - inspector
    networks:
      - edge_inspector_net

  inspector:
    build:
      context: ../..
      dockerfile: services/recorder/Dockerfile
    environment:
      CAPTURE_STORAGE_DIR: /var/lib/proxyconsole
      CAPTURE_MAX_BODY_BYTES: "${CAPTURE_MAX_BODY_BYTES:-1048576}"
      CAPTURE_OVERFLOW_MODE: "${CAPTURE_OVERFLOW_MODE:-truncated}"
      UPSTREAM_TARGET: http://router:8080
      REPLAY_EDGE_URL: https://edge:443
      REPLAY_CACERT: /etc/proxyconsole/certs/edge.crt
    command:
      - mitmdump
      - --mode
      - reverse:http://router:8080
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "8080"
      - -s
      - /app/recorder/addon.py
      - --set
      - keep_host_header=true
      - --set
      - block_global=false
      - --set
      - confdir=/tmp/mitmproxy
    expose:
      - "8080"
    volumes:
      - capture_data:/var/lib/proxyconsole
    depends_on:
      - router
    networks:
      - edge_inspector_net
      - inspector_router_net

  control-api:
    build:
      context: ../..
      dockerfile: services/recorder/Dockerfile
    environment:
      CAPTURE_STORAGE_DIR: /var/lib/proxyconsole
      CONTROL_API_LISTEN_HOST: 0.0.0.0
      CONTROL_API_PORT: "18480"
      WEB_CONSOLE_DIR: /app/web/console
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      REPLAY_EDGE_URL: https://edge:443
      REPLAY_CACERT: /etc/proxyconsole/certs/edge.crt
    command:
      - sh
      - -c
      - "chmod 0666 /var/run/docker.sock 2>/dev/null || true; exec gosu mitmproxy python3 /app/recorder/api_server.py"
    ports:
      - "127.0.0.1:${CONTROL_API_PORT:-18480}:18480"
    volumes:
      - capture_data:/var/lib/proxyconsole
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - inspector
    networks:
      - edge_inspector_net

  router:
    build:
      context: ../..
      dockerfile: deploy/nginx/router/Dockerfile
    expose:
      - "8080"
    volumes:
      - capture_data:/var/lib/proxyconsole
    depends_on:
      - echo-a
      - echo-b
    networks:
      - inspector_router_net
      - router_targets_net

  echo-a:
    build:
      context: ../..
      dockerfile: tests/helpers/Dockerfile
    environment:
      TARGET_ID: echo-a
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "8080"
    expose:
      - "8080"
    networks:
      - router_targets_net

  echo-b:
    build:
      context: ../..
      dockerfile: tests/helpers/Dockerfile
    environment:
      TARGET_ID: echo-b
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "8080"
      EXTRA_LISTEN_PORT: "8081"
    expose:
      - "8080"
      - "8081"
    networks:
      - router_targets_net

volumes:
  capture_data:

networks:
  edge_inspector_net:
    driver: bridge
  inspector_router_net:
    driver: bridge
    internal: true
  router_targets_net:
    driver: bridge
    internal: true
