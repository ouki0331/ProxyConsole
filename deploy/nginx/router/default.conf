map $http_host $router_forwarded_host {
    default $http_host;
    ""      $host;
}

server {
    listen 8080 default_server;
    server_name _;

    location / {
        default_type application/json;
        return 404 '{"error":"unknown_host","message":"No route configured for Host","host":"$router_forwarded_host"}\n';
    }
}

server {
    listen 8080;
    server_name app-a.local.test;

    resolver 127.0.0.11 valid=1s ipv6=off;

    location / {
        set $target_echo_a http://echo-a:8080;
        proxy_pass $target_echo_a;
        proxy_http_version 1.1;
        proxy_set_header Host $router_forwarded_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $router_forwarded_host;
    }
}

server {
    listen 8080;
    server_name app-b.local.test;

    resolver 127.0.0.11 valid=1s ipv6=off;

    location / {
        set $target_echo_b http://echo-b:8080;
        proxy_pass $target_echo_b;
        proxy_http_version 1.1;
        proxy_set_header Host $router_forwarded_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $router_forwarded_host;
    }
}
